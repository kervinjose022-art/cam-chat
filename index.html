<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamChat Plataforma</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #ff4081; }
        .btn { background-color: #ff4081; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; width: 100%; }
        .btn:hover { background-color: #f50057; }
        .info-box { background: #2d2d2d; padding: 15px; border-radius: 5px; margin-top: 15px; text-align: left; }
        .status { color: #4caf50; font-weight: bold; }
        .token-count { font-size: 24px; color: #ffeb3b; font-weight: bold; }
        .error-log { color: #ff5252; font-size: 12px; margin-top: 10px; background: #000; padding: 5px; display: none; border-radius: 3px; text-align: left; overflow-x: auto; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎙️ CamChat Live</h1>
        <p>Plataforma Streaming & Webcam (Control de Intermediario)</p>
        
        <div class="info-box">
            <h3>🔴 Estado del Servidor: <span class="status">En Línea</span></h3>
            <p><strong>Base de Datos:</strong> Cloud Firestore Activa</p>
            <p><strong>Tu Balance Actual:</strong> <span class="token-count" id="balance-view">Buscando Saldo...</span> Tokens</p>
            <div id="error-box" class="error-log"></div>
        </div>

        <div class="info-box">
            <h3>👥 Panel de Control Real</h3>
            <button class="btn" id="btn-regalo">🎁 Enviar Regalo Real (Restar 50 Tokens)</button>
            <button class="btn" style="background-color: #3f51b5;" id="btn-recarga">💳 Recargar 500 Tokens (Simular Pago)</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, getDocs, doc, onSnapshot, updateDoc, increment } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyDZVxxoL8K1bg_Q2CFEZjukWbx9DCZcXkQ",
            authDomain: "camchat-900d6.firebaseapp.com",
            projectId: "camchat-900d6",
            storageBucket: "://appspot.com",
            messagingSenderId: "434447301379",
            appId: "1:434447301379:web:a5571e06a1c69530cb0736"
        };

        function mostrarError(err) {
            const box = document.getElementById("error-box");
            box.style.display = "block";
            box.innerText = "Error Técnico: " + err;
        }

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            let usuarioRef = null;

            async function inicializarConexion() {
                try {
                    const querySnapshot = await getDocs(collection(db, "usuarios"));
                    if (!querySnapshot.empty) {
                        const primerDoc = querySnapshot.docs[0];
                        usuarioRef = doc(db, "usuarios", primerDoc.id);
                        
                        onSnapshot(usuarioRef, (docSnap) => {
                            if (docSnap.exists()) {
                                document.getElementById("balance-view").innerText = docSnap.data().tokens_balance ?? 0;
                            } else {
                                document.getElementById("balance-view").innerText = "Doc no existe";
                            }
                        }, (error) => {
                            mostrarError("onSnapshot falló: " + error.message);
                        });
                    } else {
                        document.getElementById("balance-view").innerText = "Crea un usuario";
                    }
                } catch (e) {
                    mostrarError("Error leyendo colección: " + e.message);
                    document.getElementById("balance-view").innerText = "Error BD";
                }
            }

            inicializarConexion();

            document.getElementById("btn-regalo").addEventListener("click", async () => {
                if (usuarioRef) {
                    try {
                        await updateDoc(usuarioRef, { tokens_balance: increment(-50) });
                    } catch(e) { alert("Error al restar: " + e.message); }
                } else { alert("Servidor desconectado"); }
            });

            document.getElementById("btn-recarga").addEventListener("click", async () => {
                if (usuarioRef) {
                    try {
                        await updateDoc(usuarioRef, { tokens_balance: increment(500) });
                    } catch(e) { alert("Error al sumar: " + e.message); }
                } else { alert("Servidor desconectado"); }
            });

        } catch (globalError) {
            mostrarError("Error inicialización Firebase: " + globalError.message);
        }
    </script>
</body>
</html>
