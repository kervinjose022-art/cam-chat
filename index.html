<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamChat Plataforma</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; text-align: center; padding: 10px; margin: 0; }
        .container { max-width: 600px; margin: 10px auto; background: #1e1e1e; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #ff4081; margin-bottom: 5px; font-size: 24px; }
        .btn { background-color: #ff4081; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; }
        .btn:hover { background-color: #f50057; }
        .info-box { background: #2d2d2d; padding: 12px; border-radius: 5px; margin-top: 10px; text-align: left; }
        .status { color: #4caf50; font-weight: bold; }
        .token-count { font-size: 26px; color: #ffeb3b; font-weight: bold; }
        .debug-msg { color: #888; font-size: 11px; margin-top: 5px; font-style: italic; }
        #video-container { width: 100%; height: 300px; background-color: #000; margin-top: 15px; border-radius: 8px; overflow: hidden; border: 2px solid #ff4081; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎙️ CamChat Live</h1>
        <p style="margin: 0; color: #aaa; font-size: 13px;">Plataforma Streaming & Webcam (Control de Intermediario)</p>
        
        <!-- Cuadro de Video Multidispositivo -->
        <div id="video-container"></div>

        <div class="info-box">
            <h3>🔴 Servidor de Video: <span class="status">ZEGOCLOUD Activo</span></h3>
            <p style="margin: 5px 0;"><strong>Tu Balance Actual:</strong> <span class="token-count" id="balance-view">1000</span> Tokens</p>
            <div id="debug-box" class="debug-msg">Esperando sincronización con el satélite de video...</div>
        </div>

        <div class="info-box">
            <h3>👥 Panel de Control</h3>
            <button class="btn" id="btn-regalo">🎁 Enviar Regalo Real (Restar 50 Tokens)</button>
            <button class="btn" style="background-color: #3f51b5;" id="btn-recarga">💳 Recargar 500 Tokens (Simular Pago)</button>
        </div>
    </div>

    <!-- Carga Prioritaria del Motor de Video Original de Zego -->
    <script src="https://unpkg.com"></script>

    <script>
        // --- SISTEMA FINANCIERO INTEGRADO ---
        if (!localStorage.getItem('tokens_balance')) {
            localStorage.setItem('tokens_balance', '1000');
        }
        const balanceView = document.getElementById("balance-view");
        const debugBox = document.getElementById("debug-box");

        function actualizarPantalla() {
            balanceView.innerText = localStorage.getItem('tokens_balance');
        }
        actualizarPantalla();

        document.getElementById("btn-regalo").addEventListener("click", () => {
            let saldo = parseInt(localStorage.getItem('tokens_balance'));
            if (saldo >= 50) {
                saldo -= 50;
                localStorage.setItem('tokens_balance', saldo.toString());
                actualizarPantalla();
                debugBox.innerText = "¡Regalo enviado con éxito! Tu comisión del 30% ha sido retenida.";
                alert("¡Regalo enviado con éxito! Se descontaron 50 tokens.");
            } else { alert("Saldo insuficiente. Por favor recarga."); }
        });

        document.getElementById("btn-recarga").addEventListener("click", () => {
            let saldo = parseInt(localStorage.getItem('tokens_balance'));
            saldo += 500;
            localStorage.setItem('tokens_balance', saldo.toString());
            actualizarPantalla();
            debugBox.innerText = "Recarga procesada exitosamente mediante pasarela simulada.";
            alert("¡Recarga exitosa! Se han acreditado 500 tokens.");
        });

        // --- SISTEMA DE INICIO SEGURO CON RETARDO (TEMPORIZADOR) ---
        function encenderCamaraSegura() {
            const appID = 1783743082;
            const serverSecret = "8e5ede7da6087d2a9fccb7f611ff60ed";
            const roomID = "sala_webcam_prueba";
            const userID = "user_" + Math.floor(Math.random() * 10000);
            const userName = "Invitado_Celular";

            // Verificar si el motor ya se descargó en la memoria del teléfono
            if (typeof ZegoUIKitPrebuilt !== 'undefined') {
                try {
                    const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(appID, serverSecret, roomID, userID, userName);
                    const zp = ZegoUIKitPrebuilt.create(kitToken);
                    
                    zp.joinRoom({
                        container: document.getElementById('video-container'),
                        sharedLinks: [],
                        showPreJoinView: false,
                        turnOnCameraWhenJoining: true,
                        turnOnMicrophoneWhenJoining: true
                    });
                    debugBox.innerText = "Conexión multimedia establecida al 100%.";
                } catch(err) {
                    debugBox.innerText = "Error interno de Zego: " + err.message;
                }
            } else {
                // Si aún no está listo, esperar 1 segundo más e intentarlo otra vez automáticamente
                debugBox.innerText = "Reintentando conexión segura en 1 segundo...";
                setTimeout(encenderCamaraSegura, 1000);
            }
        }

        // Ejecutar el temporizador en cuanto cargue la página
        window.addEventListener('load', () => {
            setTimeout(encenderCamaraSegura, 1500); // Espera un segundo y medio para asegurar descargas
        });
    </script>
</body>
</html>
