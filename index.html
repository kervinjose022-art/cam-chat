<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamChat Plataforma</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #ff4081; }
        .btn { background-color: #ff4081; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; width: 100%; font-weight: bold; }
        .btn:hover { background-color: #f50057; }
        .info-box { background: #2d2d2d; padding: 15px; border-radius: 5px; margin-top: 15px; text-align: left; }
        .status { color: #4caf50; font-weight: bold; }
        .token-count { font-size: 28px; color: #ffeb3b; font-weight: bold; transition: all 0.3s; }
        .debug-msg { color: #888; font-size: 11px; margin-top: 5px; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎙️ CamChat Live</h1>
        <p>Plataforma Streaming & Webcam (Control de Intermediario)</p>
        
        <div class="info-box">
            <h3>🔴 Estado del Servidor: <span class="status">En Línea</span></h3>
            <p><strong>Base de Datos:</strong> Motor de Tiempo Real Activado</p>
            <p><strong>Tu Balance Actual:</strong> <span class="token-count" id="balance-view">1000</span> Tokens</p>
            <div id="debug-box" class="debug-msg">Conectado con éxito al usuario: prueba_user</div>
        </div>

        <div class="info-box">
            <h3>👥 Panel de Control Interactivo</h3>
            <button class="btn" id="btn-regalo">🎁 Enviar Regalo Real (Restar 50 Tokens)</button>
            <button class="btn" style="background-color: #3f51b5;" id="btn-recarga">💳 Recargar 500 Tokens (Simular Pago)</button>
        </div>
    </div>

    <script>
        // Inicializar el saldo en la memoria local si no existe
        if (!localStorage.getItem('tokens_balance')) {
            localStorage.setItem('tokens_balance', '1000');
        }

        const balanceView = document.getElementById("balance-view");
        const debugBox = document.getElementById("debug-box");

        // Función para actualizar la pantalla
        function actualizarPantalla() {
            const saldoActual = localStorage.getItem('tokens_balance');
            balanceView.innerText = saldoActual;
        }

        // Cargar saldo inicial
        actualizarPantalla();

        // Botón Enviar Regalo
        document.getElementById("btn-regalo").addEventListener("click", () => {
            let saldo = parseInt(localStorage.getItem('tokens_balance'));
            if (saldo >= 50) {
                saldo -= 50;
                localStorage.setItem('tokens_balance', saldo.toString());
                actualizarPantalla();
                
                // Efecto visual rápido
                balanceView.style.color = "#ff5252";
                setTimeout(() => { balanceView.style.color = "#ffeb3b"; }, 300);
                
                debugBox.innerText = "¡Regalo enviado! Tu comisión de intermediario (30%) ha sido retenida.";
                alert("¡Regalo enviado con éxito! Se descontaron 50 tokens.");
            } else {
                alert("Saldo insuficiente. Por favor recarga tokens.");
            }
        });

        // Botón Recargar
        document.getElementById("btn-recarga").addEventListener("click", () => {
            let saldo = parseInt(localStorage.getItem('tokens_balance'));
            saldo += 500;
            localStorage.setItem('tokens_balance', saldo.toString());
            actualizarPantalla();
            
            // Efecto visual rápido
            balanceView.style.color = "#4caf50";
            setTimeout(() => { balanceView.style.color = "#ffeb3b"; }, 300);
            
            debugBox.innerText = "Pago procesado. 500 tokens abonados al balance.";
            alert("¡Recarga exitosa! Se han acreditado 500 tokens a tu balance.");
        });
    </script>
</body>
</html>
