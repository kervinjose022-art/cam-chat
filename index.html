<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamChat Plataforma</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #ff4081; }
        .btn { background-color: #ff4081; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; width: 100%; }
        .btn:hover { background-color: #f50057; }
        .info-box { background: #2d2d2d; padding: 15px; border-radius: 5px; margin-top: 15px; text-align: left; }
        .status { color: #4caf50; font-weight: bold; }
        .token-count { font-size: 24px; color: #ffeb3b; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎙️ CamChat Live</h1>
        <p>Plataforma Streaming & Webcam (Control de Intermediario)</p>
        
        <div class="info-box">
            <h3>🔴 Estado del Servidor: <span class="status">En Línea</span></h3>
            <p><strong>Base de Datos:</strong> Cloud Firestore Activa</p>
            <p><strong>Tu Balance Actual:</strong> <span class="token-count" id="balance-view">Cargando...</span> Tokens</p>
        </div>

        <div class="info-box">
            <h3>👥 Panel de Control Real</h3>
            <button class="btn" id="btn-regalo">🎁 Enviar Regalo Real (Restar 50 Tokens)</button>
            <button class="btn" style="background-color: #3f51b5;" id="btn-recarga">💳 Recargar 500 Tokens (Simular Pago)</button>
        </div>
    </div>

    <!-- SDK de Firebase -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://gstatic.com";

        // Tus llaves reales de CamChat extraídas de la imagen
        const firebaseConfig = {
            apiKey: "AIzaSyDZVxxoL8K1bg_Q2CFEZjukWbx9DCZcXkQ",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "camchat-900d6",
            storageBucket: "://appspot.com",
            messagingSenderId: "434447301379",
            appId: "1:434447301379:web:a5571e06a1c69530cb0736"
        };

        // Inicializar Firebase y Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Como creamos un ID automático en Firestore, usaremos el registro existente de tu base de datos
        // Nota: Al conectar el login real esto se vuelve dinámico. Por ahora usaremos una referencia directa.
        const usuarioRef = doc(db, "usuarios", "ID_DE_TU_DOCUMENTO"); 
        
        // TIP: Para pruebas rápidas, buscaremos el primer documento disponible de la colección 'usuarios'
        // Escuchar balance a tiempo real de la base de datos
        // NOTA: Como en tu pantalla el documento tiene un ID aleatorio, vamos a apuntar al usuario de prueba de forma dinámica en tu consola.
        // Para que funcione de inmediato sin configurar IDs largos, crearemos un acceso directo:
        const HardcodedUserRef = doc(db, "usuarios", "prueba_user");

        // Creamos/actualizamos un usuario fijo para pruebas rápidas
        async function inicializarUsuarioPrueba() {
            try {
                await updateDoc(HardcodedUserRef, { nombre: "Admin_Carlos", tokens_balance: increment(0) });
            } catch {
                // Si no existe el ID fijo 'prueba_user', puedes interactuar directamente desde consola.
                console.log("Configurando flujo de tiempo real...");
            }
        }
        inicializarUsuarioPrueba();

        // Escuchar cambios en caliente
        onSnapshot(HardcodedUserRef, (docSnap) => {
            if (docSnap.exists()) {
                const datos = docSnap.data();
                document.getElementById("balance-view").innerText = datos.tokens_balance || 0;
            } else {
                document.getElementById("balance-view").innerText = "Creando registro...";
                updateDoc(HardcodedUserRef, { nombre: "Admin_Carlos", tokens_balance: 1000, rol: "admin", esta_online: true });
            }
        });

        // Botón Enviar Regalo (Resta tokens en vivo en Firestore)
        document.getElementById("btn-regalo").addEventListener("click", async () => {
            try {
                await updateDoc(HardcodedUserRef, {
                    tokens_balance: increment(-50)
                });
                alert("¡Regalo enviado! Se descontaron 50 tokens de tu base de datos en tiempo real.");
            } catch (error) {
                alert("Error al conectar con Firestore. Asegúrate de estar usando el usuario correcto.");
            }
        });

        // Botón Recargar (Suma tokens en vivo en Firestore)
        document.getElementById("btn-recarga").addEventListener("click", async () => {
            await updateDoc(HardcodedUserRef, {
                tokens_balance: increment(500)
            });
            alert("¡Pago procesado! Se abonaron 500 tokens a tu cuenta en Firestore.");
        });

    </script>
</body>
</html>
